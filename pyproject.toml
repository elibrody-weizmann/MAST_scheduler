[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MAST-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Scheduler core
    "fastapi>=0.110",
    "uvicorn[standard]",
    "astropy>=6.0",
    "astroplan>=0.10",
    "pydantic>=2.0",
    "tomlkit",
    "python-ulid",
    # MAST_common transitive deps (no pyproject.toml in MAST_common)
    "pymongo",
    "numpy",
    "rich",
    "cachetools",
    "humanfriendly",
    "psutil",
    "watchdog",
    "GitPython",
    "matplotlib",
    "Pillow",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/MAST_scheduler"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
